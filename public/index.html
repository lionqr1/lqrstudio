<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feel Good Soccer Engine</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <h1>Feel Good Soccer</h1>
        <p>Arcade 1v1 soccer you can embed in any HTML page.</p>
      </header>

      <section class="hud" aria-live="polite">
        <div><strong>Blue:</strong> <span id="score-left">0</span></div>
        <div><strong>Orange:</strong> <span id="score-right">0</span></div>
        <div><strong>Timer:</strong> <span id="timer">90</span>s</div>
      </section>

      <canvas
        id="soccer-canvas"
        width="960"
        height="540"
        role="img"
        aria-label="Soccer field gameplay canvas"
      ></canvas>

      <section class="controls">
        <h2>Controls</h2>
        <p><strong>Blue Player:</strong> WASD to move, F to kick.</p>
        <p><strong>Orange Player:</strong> Arrow keys to move, / to kick.</p>
        <button id="restart-btn" type="button">Restart Match</button>
      </section>
    </main>

    <script type="module" src="/soccer-engine.js"></script>
  </body>
</html>
